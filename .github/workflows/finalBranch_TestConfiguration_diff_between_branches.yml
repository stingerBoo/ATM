name: C/C++test with Make

on:
  # Triggers the workflow on push or pull request events but only for the master (main) branch.
  push:
    #branches: [ main, main ]
    #branches: [ main ]
    branches: [ branch1 ]
  pull_request:
    #branches: [ main, main ]
    #branches: [ main ]
    branches: [ branch1 ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  run-cpptest-make:
    name: Analyze project with C/C++test

    # Specifies required permissions for upload-sarif action
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: read

    # Specifies the type of runner that the job will run on.
    runs-on: self-hosted

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:

    # Checks out your repository under $GITHUB_WORKSPACE, so that your job can access it.
    - name: Checkout repository
      # Use the 'run-cpptest-action' GitHub action.
      uses: actions/checkout@v6      
      with:  
       #ref: 'main'
       set-safe-directory: 'D:/workspace/github/cpptest2025.2standard_runner/ATM'
       fetch-depth: 0
       
    # Use git command and add safe.directory which potentially solves 
    # the issue with Test Configuration > Scope > "Test only files modified between the current working branch and 'main'"
    - name: a few commands
      shell: cmd
      run: git fetch --all |
           git rev-parse --verify --quiet main |
           git config --global --add safe.directory "D:\workspace\github\cpptest2025.2standard_runner\ATM"   
    
     # Runs code analysis with C/C++test.
    - name: Run C/C++test
      # Use the 'run-cpptest-action' GitHub action.
      uses: parasoft/run-cpptest-action@2.0.2
      with:
        # ${cpptestcli} is taken from System environemnt.
       commandLinePattern: '${cpptestcli} -input "d:\workspace\github\cpptest2025.2standard_runner\ATM\ATM_github.bdf" -compiler gcc_9-64 -config "C:\Parasoft\cpptest\2025.2_standard\configs\user\MISRA C 2023 (MISRA C 2012) branch1 main.properties" -localsettings "D:\workspace\cpptest\cpptest2025.2_runner.properties" -showdetails'
      
    # Uploads analysis results in the SARIF format, so that they are displayed as GitHub code scanning alerts.
    - name: Upload results (SARIF)
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: _report/report.sarif
    
    # Uploads an archive that includes all report files (.xml, .html, .sarif).
    - name: Archive reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Static analysis reports
        path: _report/*.*
